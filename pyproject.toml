[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clipboard-history"
version = "1.0.2"
description = "Local text and image clipboard history for Debian"
requires-python = ">=3.10"

[project.scripts]
clipboard-history = "clipboard_history.app:main"

[tool.setuptools.packages.find]
include = ["clipboard_history*"]